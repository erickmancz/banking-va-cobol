name: Extrato Java

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build e testes
        working-directory: extrato-java
        run: mvn -B -ntp verify
      - name: Confirmar execução do golden versionado
        working-directory: extrato-java
        run: |
          python3 -c '
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("target/surefire-reports/TEST-br.com.air.extrato.RegressaoTest.xml")
          root = ET.parse(report).getroot()
          tests = [case for case in root.findall("testcase")
                   if case.get("classname") == "br.com.air.extrato.RegressaoTest"
                   and case.get("name") == "goldenCobolMockOriginal"]
          if len(tests) != 1 or any(tests[0].find(tag) is not None for tag in ("skipped", "failure", "error")):
              raise SystemExit("O teste golden deve executar exatamente uma vez e passar")
          print("Golden versionado executado e aprovado")
          '

  cobol-mock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2
        with:
          environment-name: extrato-cobol
          micromamba-version: '2.10.0-0'
          create-args: >-
            -c conda-forge
            gnucobol=3.2=h6df41c7_2
      - name: Identificar compilador
        shell: micromamba-shell {0}
        run: |
          cobc -V
          gcc --version
          micromamba list -n extrato-cobol
      - name: Empacotar Java
        working-directory: extrato-java
        run: mvn -B -ntp -DskipTests package
      - name: Comparar COBOL real, JAR e golden
        shell: micromamba-shell {0}
        env:
          LC_ALL: C
        run: python3 scripts/test-diferencial.py
